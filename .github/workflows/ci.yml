name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_cloudflare:
        description: 打包完成后部署到 Cloudflare Workers
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 检查与单测
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:cloudflare

  package-cloudflare:
    name: 打包 Cloudflare
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cf:build
        env:
          APP_GIT_COMMIT_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: open-next-${{ github.sha }}
          path: .open-next
          if-no-files-found: error
          retention-days: 7

  deploy-cloudflare:
    name: 部署 Cloudflare
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_cloudflare
    runs-on: ubuntu-latest
    needs: package-cloudflare
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: open-next-${{ github.sha }}
          path: .open-next
      - run: npm ci
      - name: 应用 D1 迁移并发布 Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_GIT_COMMIT_SHA: ${{ github.sha }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "缺少 CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "缺少 CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          npm run cf:db:deploy
          npx wrangler deploy

  package-docker:
    name: 打包 Docker
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: image
        run: echo "name=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建网站镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://ci.example.com
            APP_GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=ow-runner
          cache-to: type=gha,mode=max,scope=ow-runner
      - name: 构建迁移镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}-migrate
            ${{ steps.image.outputs.name }}:main-migrate
          cache-from: type=gha,scope=ow-migrate
          cache-to: type=gha,mode=max,scope=ow-migrate
